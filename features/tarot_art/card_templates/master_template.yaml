# ORACLY Tarot Master Card Template — Machine-Readable Spec
template_id: oracly_card_master_v1
version: "1.1"
frame_version: "1.1"
frame_lock: OR-1330
locked_frame_asset: oracly_tarot_frame_locked_v1.1.png
art_direction: OR-1300
pipeline: OR-1310

canvas:
  master:
    width: 1024
    height: 1792
    dpi: 144
  production:
    width: 512
    height: 896
    dpi: 72
  aspect_ratio: "512:896"
  aspect_ratio_decimal: 0.5714285714
  corner_radius_px:
    master: 24
    production: 12

mandatory_components:
  - id: roman_numeral
    layer: L10_numeral
    zone: top
    locked_cartouche: true
  - id: card_title
    layer: L11_title
    zone: bottom
    locked_nameplate: true
  - id: central_illustration
    layer: L03_illustration
    zone: center
    unique_per_card: true
  - id: element_symbol
    layer: L12_element_sigil
    zone: bottom_inner_frame
    locked_position: true
  - id: arcana_symbol
    layer: L13_arcana_sigil
    zone: side_rail
    locked_position: true
  - id: luxury_border
    layers: [L01_frame_outer, L02_frame_inner]
    locked: true
  - id: bottom_ornament
    layer: L14_bottom_ornament
    locked: true
  - id: card_finish
    layer: L20_finish
    locked_recipe: true

zones:
  top:
    y_start: 0.0
    y_end: 0.08
    content: [roman_numeral_cartouche]
  illustration:
    x_start: 0.06
    x_end: 0.94
    y_start: 0.08
    y_end: 0.76
    inner_padding_px: 24
  bottom:
    y_start: 0.76
    y_end: 1.0
    content: [bottom_ornament, nameplate, card_title, element_symbols]
  side_rails:
    x_start: 0.0
    x_end: 0.06
    mirror_right: true
    content: [arcana_markers, vertical_filigree]

illustration_safe_zone_px:
  master:
    x: 61
    y: 143
    width: 902
    height: 1219

border:
  outer_bevel_px: 2
  gutter_px: 4
  gutter_color: "#060410"
  filigree_band_px: 8
  velvet_inset_px: 3
  velvet_color: "#12071F"
  vignette_inset_pct: 0.02

typography:
  numeral:
    color: "#D4AF37"
    max_height_pct: 0.05
    style: classical_roman_serif
  title:
    color: "#F0D77A"
    max_height_pct: 0.065
    case: title
    tracking_em: 0.08
    plaque:
      material: obsidian_crystal
      height_px_production: 139
      empty_in_locked_asset: true
      gold_engraved_edge: true

sigils:
  element:
    size_px_master: 48
    positions: [bottom_left, bottom_right]
    emboss: gold
  arcana:
    major: or_eye_prism_hex
    minor: suit_sigil_repeat

finish_layer:
  frame_gloss_boost_pct: 15
  illustration_surface: matte
  holographic_channel: optional_legendary_ui_only
  obsidian_depth_stops: ["#030106", "#060410", "#0A0812"]
  crystal_cyan_refraction: "#A8E8FF"
  micro_engraving: true

frame_v1_1:
  centerpiece: vesica_compass_OL7
  inner_ring: oracle_veil_ring
  corner_system: harmonic_meridian_grid
  side_density_reduction_pct: 20
  visual_dna: OR_Lattice
  spec: master_card/OR-1330_FRAME_LOCK_REVISION.md
