name: oracly_new
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # OpenAI bağlantısı
  http: ^1.2.2

  # API anahtarını güvenli okumak için
  flutter_dotenv: ^5.2.1

  # Oracly hafıza sistemi için
  shared_preferences: ^2.5.3

  # State management — OR-1100
  flutter_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # .env is intentionally not bundled — loaded optionally in main.dart when present.
    - lib/assets/images/
    - lib/assets/icons/