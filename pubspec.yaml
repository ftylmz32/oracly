name: oracly_new
description: "ORACLY — premium digital sanctuary for reflection."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Locale-aware dates, times, and number grouping
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

  # OpenAI bağlantısı
  http: ^1.2.2

  # API anahtarını güvenli okumak için
  flutter_dotenv: ^5.2.1

  # Oracly hafıza sistemi için
  shared_preferences: ^2.5.3

  # Keystore / Keychain-backed credential storage
  flutter_secure_storage: ^9.2.4

  # State management — OR-1100
  flutter_riverpod: ^2.6.1

  # EPIC-015 — Subtle procedural ambience & SFX
  audioplayers: ^6.1.0

  # Kahve Falı — camera / gallery input
  image_picker: ^1.1.2

  # Tasteful discovery share sheet (caption + card image)
  share_plus: ^11.0.0

  # Dream Sesli Anlat — OS speech-to-text (not OpenAI)
  speech_to_text: ^7.4.0
  permission_handler: ^12.0.1
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  flutter_tts: ^4.2.5
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  camera: ^0.12.0+2
  in_app_purchase: ^3.3.0
  flutter_image_compress: ^2.5.1
  image: ^4.9.2
  firebase_app_check: 0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env.example
    - assets/splash/
    # Directory include omitted — would ship unused tarot PNG masters (~167MB).
    - lib/assets/images/coffee_ritual_hero.webp
    - lib/assets/images/dream/dream_entry_hero.webp
    - lib/assets/images/daily_moon_photoreal.webp
    - lib/assets/images/or_presence_orb.webp
