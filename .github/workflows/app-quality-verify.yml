name: App Quality Verify

on:
  workflow_dispatch:
  push:
    branches:
      - 'app/**'
  pull_request:
    branches:
      - roadmap/monetization-release-audit

concurrency:
  group: app-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: App resilience tests
        run: |
          flutter test test/dream_entry_draft_store_test.dart
          flutter test test/features/astrology/astrology_personalization_test.dart
          flutter test test/screens/profile/name_edit_material_test.dart
          flutter test test/screens/profile/profile_photo_store_test.dart
          flutter test test/features/discovery_journal/discovery_journal_test.dart
          flutter test test/features/companion/companion_reference_completion_test.dart
          flutter test test/features/coffee/coffee_cancel_analysis_test.dart
          flutter test test/features/coffee/coffee_result_flow_test.dart
          flutter test test/features/palm/palm_controller_analysis_test.dart
          flutter test test/features/palm/palm_result_flow_test.dart
          flutter test test/features/tarot/tarot_cinematic_motion_test.dart
