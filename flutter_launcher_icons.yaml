# ORACLY official logo → platform launcher icons.
# Master: assets/brand/oracly_launcher_source.png
# Runtime copy: lib/assets/brand/oracly_logo.png
# Run: dart run flutter_launcher_icons

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: lib/assets/brand/oracly_logo.png
    background_color: "#050208"
    theme_color: "#050208"
  windows:
    generate: false
  macos:
    generate: true
    image_path: lib/assets/brand/oracly_logo.png
  image_path: lib/assets/brand/oracly_logo.png
  adaptive_icon_background: "#050208"
  adaptive_icon_foreground: lib/assets/brand/oracly_logo.png
  min_sdk_android: 21
  remove_alpha_ios: true
