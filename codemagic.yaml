workflows:
  ios-release:
    name: ORACLY iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: "ORACLY Codemagic"

    environment:
      groups:
        - ios_secrets
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.oracly
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Restore Firebase iOS config
        script: |
          if [ -z "${FIREBASE_IOS_PLIST_B64:-}" ]; then
            echo "FIREBASE_IOS_PLIST_B64 is not configured"
            exit 1
          fi
          mkdir -p ios/Runner
          printf '%s' "$FIREBASE_IOS_PLIST_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/GoogleService-Info.plist
          FIREBASE_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' ios/Runner/GoogleService-Info.plist)
          if [ "$FIREBASE_BUNDLE_ID" != "app.oracly" ]; then
            echo "Firebase iOS config bundle mismatch: $FIREBASE_BUNDLE_ID"
            exit 1
          fi
          echo "Firebase iOS config restored for app.oracly"

      - name: Align FlutterFire iOS SDK versions
        script: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("pubspec.yaml")
          text = p.read_text(encoding="utf-8")
          replacements = {
              "  firebase_core: ^4.13.0": "  firebase_core: 4.14.0",
              "  firebase_auth: ^6.6.1": "  firebase_auth: 6.6.1",
              "  firebase_app_check: 0.4.6": "  firebase_app_check: 0.4.7",
              "  firebase_messaging: ^16.6.0": "  firebase_messaging: 16.6.0",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected dependency line not found: {old}")
              text = text.replace(old, new, 1)
          p.write_text(text, encoding="utf-8")
          print("Aligned FlutterFire packages to Firebase iOS SDK 12.18.0")
          PY
          rm -rf .dart_tool ios/Flutter/ephemeral
          flutter pub get

      - name: Refresh Xcode project tooling
        script: gem update xcodeproj --no-document

      - name: Normalize Xcode project encoding
        script: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ios/Runner.xcodeproj/project.pbxproj")
          data = p.read_bytes()
          if data.startswith(b"\xef\xbb\xbf"):
              p.write_bytes(data[3:])
              print("Removed UTF-8 BOM from project.pbxproj")
          else:
              print("project.pbxproj has no UTF-8 BOM")
          PY

      - name: Set up iOS code signing
        script: xcode-project use-profiles --project ios/Runner.xcodeproj --verbose

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0 \
            --build-number=1 \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
