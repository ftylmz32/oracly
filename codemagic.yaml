workflows:
  ios-release:
    name: ORACLY iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: "ORACLY Codemagic"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.oracly
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Refresh Xcode project tooling
        script: gem update xcodeproj --no-document

      - name: Normalize Xcode project encoding
        script: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ios/Runner.xcodeproj/project.pbxproj")
          data = p.read_bytes()
          if data.startswith(b"\xef\xbb\xbf"):
              p.write_bytes(data[3:])
              print("Removed UTF-8 BOM from project.pbxproj")
          else:
              print("project.pbxproj has no UTF-8 BOM")
          PY

      - name: Set up iOS code signing
        script: xcode-project use-profiles --project ios/Runner.xcodeproj --verbose

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0 \
            --build-number=1 \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
