# Isolated branch chore/asc-iap-inventory-20261028 only.
# One read-only App Store Connect inventory check, started by hand.
# No triggering (webhooks never start it), no code signing, no build,
# no publishing, no TestFlight or App Store submission.
workflows:
  asc-iap-inventory:
    name: ORACLY ASC IAP inventory (read-only)
    instance_type: mac_mini_m2
    max_build_duration: 10

    integrations:
      app_store_connect: "ORACLY Codemagic"

    scripts:
      - name: Read-only App Store Connect inventory (GET only)
        script: |
          set -euo pipefail
          node --version
          node tool/asc/asc_inventory.mjs

    artifacts:
      - asc_inventory.json
