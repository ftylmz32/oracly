      <path transform="translate(75.6 75.6) scale(.42)" d="M0-5 1.1-1.1 5 0 1.1 1.1 0 5-1.1 1.1-5 0-1.1-1.1Z"/>
      <path transform="translate(20.4 75.6) scale(.42)" d="M0-5 1.1-1.1 5 0 1.1 1.1 0 5-1.1 1.1-5 0-1.1-1.1Z"/>
      <path transform="translate(20.4 20.4) scale(.42)" d="M0-5 1.1-1.1 5 0 1.1 1.1 0 5-1.1 1.1-5 0-1.1-1.1Z"/>
    </g>
