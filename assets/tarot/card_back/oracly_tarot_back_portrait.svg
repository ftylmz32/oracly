    <circle cx="470" cy="42" r="2.2"/>
    <circle cx="42" cy="854" r="2.2"/>
    <circle cx="470" cy="854" r="2.2"/>
  </g>

  <!-- Vesica compass, top -->
  <g stroke="url(#gold)" stroke-width=".7" opacity=".55">
