    <circle cx="198" cy="286" r="1.4" fill-opacity=".24" stroke="none"/>
    <circle cx="226" cy="304" r="1.5" fill-opacity=".26" stroke="none"/>
    <path d="M168 300 L198 286 L226 304"/>
