<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 896" fill="none" aria-label="ORACLY Tarot card back">
  <defs>
    <radialGradient id="field" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#1A1630"/>
      <stop offset=".38" stop-color="#0A0914"/>
      <stop offset="1" stop-color="#030106"/>
    </radialGradient>
    <radialGradient id="veil" cx="50%" cy="46%" r="28%">
      <stop offset="0" stop-color="#4A36B0" stop-opacity=".14"/>
      <stop offset="1" stop-color="#4A36B0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="80" y1="40" x2="430" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5D98A"/>
      <stop offset=".45" stop-color="#E7C56D"/>
      <stop offset="1" stop-color="#C9A84E"/>
    </linearGradient>
  </defs>

  <rect width="512" height="896" rx="28" fill="url(#field)"/>
  <circle cx="256" cy="412" r="168" fill="url(#veil)"/>

  <rect x="22" y="22" width="468" height="852" rx="20" stroke="url(#gold)" stroke-width="1.4" opacity=".5"/>
  <rect x="34" y="34" width="444" height="828" rx="14" stroke="#E7C56D" stroke-width=".7" opacity=".22"/>

  <g fill="#F5D98A" fill-opacity=".42">
