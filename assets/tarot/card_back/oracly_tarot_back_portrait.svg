    <path d="M0 -98 v-18M0 98 v18M-98 0 h-18M98 0 h18" stroke-width="1.05" opacity=".45"/>
    <path d="M-69.3 -69.3 l-12.7 -12.7M69.3 69.3 l12.7 12.7M69.3 -69.3 l12.7 -12.7M-69.3 69.3 l-12.7 12.7"
